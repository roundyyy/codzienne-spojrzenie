# Daily edition update.
#   - Today's edition already published -> stops within seconds, nothing else happens.
#   - Otherwise checks the Dropbox .meta date; new edition -> downloads the news,
#     extracts article images once and publishes the site. Not ready yet -> the
#     next hourly run tries again.
#
# Triggers:
#   - schedule: 17:30 Irish time, then every hour until ~midnight. GitHub's cron
#     uses UTC, so 16:30-23:30 UTC covers 17:30 in winter (GMT) and summer (IST).
#     GitHub may start scheduled runs late or skip them under load.
#   - workflow_dispatch: "Run workflow" button, or an external scheduler calling
#     the GitHub API. Tick "force" to rebuild even if the edition looks current.
#   - push: publishes code changes (keeps the current edition).
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The repository itself is never modified: data/edition.js only exists in the published site.

name: Aktualizacja i publikacja strony

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "30 16-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Pobierz wydanie od nowa, nawet jeśli wygląda na aktualne"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Sprawdź wydanie i pobierz nowe
        id: edition
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python3 scripts/build_edition.py --published "${{ steps.pages.outputs.base_url }}/data/edition.js" $FORCE

      - name: Czy publikować?
        id: decide
        run: |
          if [ "${{ steps.edition.outputs.changed }}" = "true" ] \
             || [ "${{ github.event_name }}" = "push" ] \
             || [ "${{ inputs.force }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Brak nowego wydania - strona bez zmian."
          fi

      - name: Przygotuj pliki strony
        if: steps.decide.outputs.deploy == 'true'
        run: |
          # Publish only the website itself (not scripts, README, workflow).
          mkdir -p _site
          cp -r index.html assets data _site/

      - name: Wyślij pliki strony
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
